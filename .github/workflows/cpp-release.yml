name: Release C++ Library & Publish Packages

on:
  push:
    tags:
      - 'cpp-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.3). Creates tag cpp-v<version> on GitHub Release.'
        required: true
        default: '1.0.3'
        type: string
      publish_release:
        description: 'Create/update GitHub Release with ZIP/TAR.GZ assets'
        type: boolean
        default: true
      publish_packages:
        description: 'Push REDoxCpp.Native NuGet package to GitHub Packages'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cpp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Determine version and tag
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#cpp-v}"
          else
            VERSION="${{ inputs.version }}"
            TAG="cpp-v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows x64 (.lib & .dll)
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure & Build Static (.lib)
        shell: pwsh
        run: |
          cmake -S cpp -B cpp/build-static -A x64 -DBUILD_SHARED_LIBS=OFF
          cmake --build cpp/build-static --config Release --parallel
          ctest --test-dir cpp/build-static -C Release --output-on-failure

      - name: Configure & Build Shared (.dll + import .lib)
        shell: pwsh
        run: |
          cmake -S cpp -B cpp/build-shared -A x64 -DBUILD_SHARED_LIBS=ON
          cmake --build cpp/build-shared --config Release --parallel
          ctest --test-dir cpp/build-shared -C Release --output-on-failure

      - name: Package Windows Archive & Native NuGet
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.version }}"
          $dist = "cpp/dist/windows-x64"
          New-Item -ItemType Directory -Force -Path "$dist/include/redox", "$dist/static", "$dist/shared", "release-assets", "nupkg-out" | Out-Null

          Copy-Item cpp/include/redox/*.hpp "$dist/include/redox/"
          Copy-Item cpp/build-static/lib/Release/REDoxCpp.lib "$dist/static/"
          Copy-Item cpp/build-shared/bin/Release/REDoxCpp.dll "$dist/shared/"
          Copy-Item cpp/build-shared/lib/Release/REDoxCpp.lib "$dist/shared/"
          Copy-Item LICENSE "$dist/"

          Compress-Archive -Path "$dist/*" -DestinationPath "release-assets/REDoxCpp-$ver-windows-x64.zip" -Force

          nuget pack cpp/packaging/REDoxCpp.Native.nuspec `
            -Version $ver `
            -Properties "owner=${{ github.repository_owner }}" `
            -OutputDirectory nupkg-out `
            -NoPackageAnalysis

          Get-ChildItem release-assets, nupkg-out

      - name: Upload Windows Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release-assets/REDoxCpp-*-windows-x64.zip
          if-no-files-found: error

      - name: Upload Native NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: redoxcpp-nupkg
          path: nupkg-out/*.nupkg
          if-no-files-found: error

  build-linux:
    name: Build Linux x64 (.a & .so)
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure & Build Static (.a)
        run: |
          cmake -S cpp -B cpp/build-static -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build cpp/build-static --parallel
          ctest --test-dir cpp/build-static --output-on-failure

      - name: Configure & Build Shared (.so)
        run: |
          cmake -S cpp -B cpp/build-shared -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build cpp/build-shared --parallel
          ctest --test-dir cpp/build-shared --output-on-failure

      - name: Package Linux Archive
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          DIST="cpp/dist/linux-x64"
          mkdir -p "$DIST/include/redox" "$DIST/static" "$DIST/shared" release-assets
          cp cpp/include/redox/*.hpp "$DIST/include/redox/"
          cp cpp/build-static/lib/libREDoxCpp.a "$DIST/static/"
          cp cpp/build-shared/lib/libREDoxCpp.so "$DIST/shared/"
          cp LICENSE "$DIST/"
          tar -czf "release-assets/REDoxCpp-${VER}-linux-x64.tar.gz" -C "$DIST" .
          ls -lh release-assets

      - name: Upload Linux Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: release-assets/REDoxCpp-*-linux-x64.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [resolve-version, build-windows, build-linux]
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: assets

      - name: Generate SHA256SUMS
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* \
              --title "REDoxCpp v${VERSION}" \
              --generate-notes
          fi

  publish-packages:
    name: Push Native Package to GitHub Packages
    needs: [resolve-version, build-windows]
    if: github.event_name == 'push' || inputs.publish_packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: redoxcpp-nupkg
          path: nupkg-out

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Push REDoxCpp.Native to GitHub Packages
        run: |
          dotnet nuget push "nupkg-out/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
